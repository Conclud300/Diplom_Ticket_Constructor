databases:
  - name: ticket-db
    databaseName: ticket_db
    user: ticket_user

services:
  - type: web
    name: ticket-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://ваш-фронтенд.onrender.com,https://ваш-фронтенд.netlify.app"
      - key: WEB_CONCURRENCY
        value: 1